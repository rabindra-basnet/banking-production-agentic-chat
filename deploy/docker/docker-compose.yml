version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-accounts:
        condition: service_started
      mcp-transactions:
        condition: service_started
      mcp-services:
        condition: service_started
    networks:
      - banking-chat

  mcp-accounts:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.dev
    command: ["uv", "run", "python", "src/banking_chat/mcp_deployables/accounts_server/main.py"]
    ports:
      - "9001:9001"
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
    networks:
      - banking-chat

  mcp-transactions:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.dev
    command: ["uv", "run", "python", "src/banking_chat/mcp_deployables/transactions_server/main.py"]
    ports:
      - "9002:9002"
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
    networks:
      - banking-chat

  mcp-services:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.dev
    command: ["uv", "run", "python", "src/banking_chat/mcp_deployables/services_server/main.py"]
    ports:
      - "9003:9003"
    env_file:
      - ../../.env
    volumes:
      - ../../src:/app/src
    networks:
      - banking-chat

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - banking-chat

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: banking_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - banking-chat

volumes:
  redis_data:
  postgres_data:

networks:
  banking-chat:
    driver: bridge
