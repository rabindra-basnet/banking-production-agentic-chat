version: '3.8'

services:
  # ─── Nginx Ingress & Load Balancer ───
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-node-1
      - backend-node-2
    networks:
      - banking-net

  # ─── Distributed FastAPI Backend Cluster ───
  backend-node-1:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - banking-net

  backend-node-2:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - banking-net

  # ─── Standalone MCP Microservices ───
  mcp-accounts:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ["uv", "run", "python", "src/banking_chat/mcp/accounts/main.py"]
    env_file:
      - ../../.env
    networks:
      - banking-net

  mcp-transactions:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ["uv", "run", "python", "src/banking_chat/mcp/transactions/main.py"]
    env_file:
      - ../../.env
    networks:
      - banking-net

  mcp-services:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    command: ["uv", "run", "python", "src/banking_chat/mcp/services/main.py"]
    env_file:
      - ../../.env
    networks:
      - banking-net

  # ─── Data Infrastructure ───
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_prod_data:/data
    networks:
      - banking-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - banking-net

volumes:
  redis_prod_data:
  postgres_prod_data:

networks:
  banking-net:
    driver: bridge
