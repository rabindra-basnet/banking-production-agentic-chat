# ==============================================================================
# 🏦 Banking Production Agentic Chat — Enterprise Nginx Load Balancer & Reverse Proxy
# Standard: Reverse proxy for React SPA + Load Balancing across FastAPI backend cluster
# Supports: Zero-buffering SSE token streaming, WebSocket/HTTP2, Health probes & DDoS limits
# ==============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── High Performance Log Format ───
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_x_idempotency_key":"$http_idempotency_key",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log  main_json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off; # Security: Hide Nginx version

    # ─── DDoS / Rate Limiting Zones ───
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # ─── Gzip Compression for Frontend Assets ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── Upstream: Distributed FastAPI Backend Instances (Load Balanced) ───
    upstream fastapi_backend_cluster {
        least_conn; # Route to backend server with least active connections
        server backend-node-1:8000 max_fails=3 fail_timeout=10s;
        server backend-node-2:8000 max_fails=3 fail_timeout=10s;
        server backend-node-3:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ─── Main HTTP Server ───
    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # ─── 1. Serve Compiled React SPA Static Assets ───
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets (JS, CSS, SVGs, Fonts)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # ─── 2. Reverse Proxy & Load Balance API Endpoints ───
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;
            limit_conn addr_conn_limit 50;

            proxy_pass http://fastapi_backend_cluster;
            proxy_http_version 1.1;

            # Header Propagation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Idempotency-Key $http_idempotency_key;

            # Timeouts for Long LLM Responses
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # ─── CRITICAL FOR REAL-TIME SSE TOKEN STREAMING ───
            proxy_buffering off;         # Do not buffer chunks; push words immediately to client
            proxy_cache off;             # Disable caching for live AI streams
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # ─── 3. Health & Liveness Probe ───
        location /health {
            proxy_pass http://fastapi_backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
