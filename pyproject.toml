[project]
name = "banking-agentic-chat"
version = "0.1.0"
description = "Production-grade AI-powered banking customer support chatbot"
requires-python = ">= 3.12"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rabindra", email = "rabindra@example.com" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "mcp[cli]>=1.0.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pre-commit>=4.0.0",
    "types-redis>=4.6.0",
    "types-pyyaml>=6.0.12.20240917",
    "deepeval>=1.0.0",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_chat"]

# ─── Ruff ───
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # Allow assert in tests
    "S104",  # Binding to all interfaces in container entrypoint
    "S105",  # False positive on token prefixes
    "B008",  # Allow function calls in defaults (FastAPI Depends)
    "E501",  # Let ruff format handle formatting
    "RUF012",  # Mutable class attributes
    "S110",  # Broad exception handling
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["banking_chat"]

# ─── Mypy ───
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_openai.*",
    "mcp.*",
    "mcp.server.fastmcp.*",
    "jose.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
]
ignore_missing_imports = true

# ─── Pytest ───
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/banking_chat",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow running",
    "integration: integration tests requiring external services",
    "e2e: end-to-end tests",
    "security: security-focused tests",
    "evaluation: AI evaluation tests",
]

# ─── Bandit ───
[tool.bandit]
targets = ["src"]
skips = ["B101", "B104", "B105", "B110"]

# ─── Coverage ───
[tool.coverage.run]
source = ["src/banking_chat"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
